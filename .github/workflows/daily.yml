name: Daily market data

on:
  schedule:
    # 03:00 UTC = 08:30 IST, Monday to Friday (GitHub may start it a few minutes late)
    - cron: "0 3 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # lets the job save data.json back to the repository

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Pull market data
        run: python fetch.py

      - name: Save data.json
        run: |
          cp data.json /tmp/data.json
          git config user.name  "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/data.json data.json
          git add data.json
          git commit -m "Market data $(date -u +%F)" || echo "No changes"
          git push origin main
